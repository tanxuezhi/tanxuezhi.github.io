name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # Daily Scholar refresh. GitHub Pages remains static between refreshes.
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public Google Scholar profile and publications
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/sync_scholar.py --write --retries 3
      - name: Commit refreshed metrics
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- data/scholar-stats.json data/scholar-publications.json; then
            echo "No Scholar changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar-stats.json data/scholar-publications.json
            git commit -m "chore: refresh Google Scholar profile"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
